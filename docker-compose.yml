# Local Docker dev / smoke-test for the production image.
# Coolify does not use this file — it builds the Dockerfile directly.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: icloud-checker:local
    ports:
      - "8090:8080"
    environment:
      APP_NAME: "iCloud Checker"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8090
      APP_KEY: ${APP_KEY:-}

      LOG_CHANNEL: stderr
      LOG_LEVEL: info

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: icloud_checker
      DB_USERNAME: icloud
      DB_PASSWORD: secret

      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database

      RUN_MIGRATIONS: "true"
      RUN_QUEUE_WORKER: "true"
      RUN_SCHEDULER: "true"

      TRUSTED_PROXIES: "*"

      # First-boot admin. Pass through from the host shell so local tests can
      # exercise `php artisan admin:ensure`. Leave ADMIN_PASSWORD unset to
      # have a strong random password generated and printed once to stdout.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root-secret
      MYSQL_DATABASE: icloud_checker
      MYSQL_USER: icloud
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot-secret"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  app-storage:
  mysql-data:
