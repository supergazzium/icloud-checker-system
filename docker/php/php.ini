memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120
max_input_time = 120
date.timezone = UTC
expose_php = Off
cgi.fix_pathinfo = 0

; Session storage lives in Laravel (SESSION_DRIVER); keep native disabled for tmpfs sanity
session.gc_maxlifetime = 7200

; Realpath cache helps opcache and autoloader
realpath_cache_size = 4096K
realpath_cache_ttl = 600
